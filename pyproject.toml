[project]
name = "rise-shine-verse"
version = "0.1.0"
description = "Verse of the Day pictures and videos (Tamil and English) for Rise & Shine Ministries"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 125

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
# Palette tables read best one per line.
"daily_verse/background.py" = ["E501"]
